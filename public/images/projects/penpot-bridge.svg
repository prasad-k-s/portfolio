      <text x="100" y="335"><tspan fill="#94a3b8">&lt;/</tspan><tspan fill="#f472b6">section</tspan><tspan fill="#94a3b8">&gt;</tspan></text>
      <text x="70" y="380" fill="#e2e8f0">);</text>
      <text x="40" y="420" fill="#e2e8f0">}</text>
