    <text x="120" y="37" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">Card.tsx</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="24">
      <text x="40" y="110"><tspan fill="#c084fc">export function</tspan><tspan fill="#38bdf8"> Card</tspan><tspan fill="#e2e8f0">() {</tspan></text>
      <text x="70" y="155"><tspan fill="#c084fc">return</tspan><tspan fill="#e2e8f0"> (</tspan></text>
      <text x="100" y="200"><tspan fill="#94a3b8">&lt;</tspan><tspan fill="#f472b6">section</tspan><tspan fill="#94a3b8">&gt;</tspan></text>
